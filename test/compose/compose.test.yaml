  CARTESI_LOG_LEVEL: info
  CARTESI_BLOCKCHAIN_HTTP_ENDPOINT: http://ethereum_provider:8545
  CARTESI_BLOCKCHAIN_ID: 31337
  CARTESI_EVM_READER_POLLING_INTERVAL: 1
  CARTESI_CONTRACTS_INPUT_BOX_ADDRESS: "0xEbE915623f5887426C23C89fbD1de5c497e0e08E"
  CARTESI_CONTRACTS_AUTHORITY_FACTORY_ADDRESS: "0xAd208ee3574eB121C5535D848ba106a6EB5700D2"
  CARTESI_CONTRACTS_QUORUM_FACTORY_ADDRESS: "0x97602f62e3F69C37538c3c4Ce168911dacF5b352"
  CARTESI_CONTRACTS_APPLICATION_FACTORY_ADDRESS: "0x04BEA8345Ac754a66068b4ACde66cbC0B114A873"
  CARTESI_CONTRACTS_SELF_HOSTED_APPLICATION_FACTORY_ADDRESS: "0x2f94A7f9e15f528BFb4e31AF8d2602d4B648D107"
  CARTESI_CONTRACTS_DAVE_APP_FACTORY_ADDRESS: "0xf3E815d248480D47980aFA45508aF617Ffb2d5d6"
  CARTESI_DEVNET_WITHDRAWAL_OUTPUT_BUILDER_ADDRESS: "0xF223DEd6072F29C7C0FfAAfdBbE6aE8813a2134d"
  CARTESI_DATABASE_CONNECTION: postgres://postgres:password@database:5432/rollupsdb?sslmode=disable
  CARTESI_TEST_DATABASE_CONNECTION: postgres://test_user:password@database:5432/test_rollupsdb?sslmode=disable
  CARTESI_AUTH_MNEMONIC: "test test test test test test test test test test test junk"
  CARTESI_AUTH_MNEMONIC_ACCOUNT_INDEX: 0
  CARTESI_PRT_AUTH_MNEMONIC: "test test test test test test test test test test test junk"
  CARTESI_PRT_AUTH_MNEMONIC_ACCOUNT_INDEX: 6

services:
  ethereum_provider:
    image: cartesi/rollups-node-devnet:devel
    networks:
      - devnet
    ports:
      - 8545:8545

  database:
    image: postgres:18-alpine
    shm_size: 128mb
    networks:
      - devnet
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rollupsdb || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rollupsdb
    volumes:
      - ../postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh

  unit-test:
    image: cartesi/rollups-node:tester
    init: true
    profiles: [unit-test]
    entrypoint: ["sh", "-c"]
    command: |
      '
      set -e
      make migrate
      make test
      '
    depends_on:
      database:
        condition: service_healthy
      ethereum_provider:
        condition: service_healthy
    networks:
      - devnet
    restart: "no"
    environment:
      <<: *env
    volumes:
      - ../downloads:/usr/share/cartesi-machine/images

networks:
  devnet:
