x-env: &env
  CARTESI_LOG_LEVEL: info
  CARTESI_BLOCKCHAIN_HTTP_ENDPOINT: http://ethereum_provider:8545
  CARTESI_BLOCKCHAIN_ID: 31337
  CARTESI_EVM_READER_POLLING_INTERVAL: 1
  CARTESI_CONTRACTS_INPUT_BOX_ADDRESS: "0xEbE9f4Dfc04ae10bBeE663859c3dc5A23f94eA3C"
  CARTESI_CONTRACTS_AUTHORITY_FACTORY_ADDRESS: "0xB4d29c86e36385b5321a453C34D288AEB0ad11f9"
  CARTESI_CONTRACTS_QUORUM_FACTORY_ADDRESS: "0x0754D5Eb680c71bf469B39e48C5b64AB0813fdb9"
  CARTESI_CONTRACTS_APPLICATION_FACTORY_ADDRESS: "0x35Cd91f13141Bb6A6FC69E1eeDD241bbA1Ddd45F"
  CARTESI_CONTRACTS_SELF_HOSTED_APPLICATION_FACTORY_ADDRESS: "0x9e6866A965dC5f99f95EF6B0d8399dad18eEf98b"
  CARTESI_CONTRACTS_DAVE_APP_FACTORY_ADDRESS: "0xd34BEC37Fa5816ABA2f87BdaD2E13dd1B161370f"
  CARTESI_DEVNET_WITHDRAWAL_OUTPUT_BUILDER_ADDRESS: "0xB4D253c7a110241561B3eD6d632846dF7d4e9Af7"
  CARTESI_DATABASE_CONNECTION: postgres://postgres:password@database:5432/rollupsdb?sslmode=disable
  CARTESI_TEST_DATABASE_CONNECTION: postgres://test_user:password@database:5432/test_rollupsdb?sslmode=disable
  CARTESI_AUTH_MNEMONIC: "test test test test test test test test test test test junk"

services:
  ethereum_provider:
    image: cartesi/rollups-node-devnet:devel
    networks:
      - devnet
    ports:
      - 8545:8545

  database:
    image: postgres:18-alpine
    shm_size: 128mb
    networks:
      - devnet
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rollupsdb || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rollupsdb
    volumes:
      - ../postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh

  unit-test:
    image: cartesi/rollups-node:tester
    init: true
    profiles: [unit-test]
    entrypoint: ["sh", "-c"]
    command: |
      '
      set -e
      make migrate
      make test
      '
    depends_on:
      database:
        condition: service_healthy
      ethereum_provider:
        condition: service_healthy
    networks:
      - devnet
    restart: "no"
    environment:
      <<: *env
    volumes:
      - ../downloads:/usr/share/cartesi-machine/images

networks:
  devnet:
