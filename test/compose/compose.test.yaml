x-env: &env
  CARTESI_LOG_LEVEL: info
  CARTESI_BLOCKCHAIN_HTTP_ENDPOINT: http://ethereum_provider:8545
  CARTESI_BLOCKCHAIN_WS_ENDPOINT: ws://ethereum_provider:8545
  CARTESI_BLOCKCHAIN_ID: 31337
  CARTESI_CONTRACTS_INPUT_BOX_ADDRESS: 0x1b51e2992A2755Ba4D6F7094032DF91991a0Cfac
  CARTESI_CONTRACTS_AUTHORITY_FACTORY_ADDRESS: 0x5a3368b30174d389aFd205a46bAd35BBE6709b8a
  CARTESI_CONTRACTS_APPLICATION_FACTORY_ADDRESS: 0x26E758238CB6eC5aB70ce0dd52aF2d7b82e1972E
  CARTESI_CONTRACTS_SELF_HOSTED_APPLICATION_FACTORY_ADDRESS: 0x870240e83b1181b419f18303D4ccC56574De2931
  CARTESI_CONTRACTS_DAVE_APP_FACTORY_ADDRESS: 0x81dfc08498B86be7659eFD66702DB539DD534c9f
  CARTESI_DATABASE_CONNECTION: postgres://postgres:password@database:5432/rollupsdb?sslmode=disable
  CARTESI_TEST_DATABASE_CONNECTION: postgres://test_user:password@database:5432/test_rollupsdb?sslmode=disable
  CARTESI_AUTH_MNEMONIC: "test test test test test test test test test test test junk"

services:
  ethereum_provider:
    image: cartesi/rollups-node-devnet:devel
    networks:
      - devnet
    ports:
      - 8545:8545

  database:
    image: postgres:17-alpine
    shm_size: 128mb
    networks:
      - devnet
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rollupsdb || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rollupsdb
    volumes:
      - ../postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh

  unit-test:
    image: cartesi/rollups-node:tester
    profiles: [unit-test]
    entrypoint: ["sh", "-c"]
    command: |
      '
      set -e
      make migrate
      make test
      '
    depends_on:
      database:
        condition: service_healthy
      ethereum_provider:
        condition: service_healthy
    networks:
      - devnet
    restart: "no"
    environment:
      <<: *env
    volumes:
      - ../downloads:/usr/share/cartesi-machine/images

networks:
  devnet:
