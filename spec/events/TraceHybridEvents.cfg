\* TLC configuration for trace validation.
\*
\* Uses the same model constants as MC.tla (MaxItems=3, Workers={"w1","w2"},
\* SyncInterval=2). The trace is loaded from the generated Trace.tla module.
\*
\* Run with:
\*   java -jar tla2tools.jar -config TraceHybridEvents.cfg \
\*        -deadlock -workers auto TraceHybridEvents

CONSTANTS
    MaxItems = 3
    Workers = {"w1", "w2"}
    SyncInterval = 2

SPECIFICATION TraceSpec

INVARIANTS
    Safety_TypeOK
    Safety_NoDuplicateProcessing
