\* TLC Model Configuration for HybridEvents
\*
\* Run with:
\*   java -jar tla2tools.jar -config HybridEvents.cfg -workers auto -metadir /tmp/tlc MC.tla

\* Use <- (definition override) instead of = (model value assignment)
\* so that TLC uses the actual values from MC.tla definitions.
CONSTANTS
    MaxItems <- MC_MaxItems
    Workers <- MC_Workers
    SyncInterval <- MC_SyncInterval

\* Use MC_Spec which expands fairness for the concrete worker set.
\* TLC cannot enumerate CONSTANT sets in temporal quantifiers,
\* so the generic Spec (with \A w \in Workers) would fail.
SPECIFICATION MC_Spec

INVARIANTS
    Safety_TypeOK
    Safety_NoDuplicateProcessing

PROPERTIES
    Liveness_EventualProcessing
