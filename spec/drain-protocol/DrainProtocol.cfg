\* TLC Model Configuration for DrainProtocol
\*
\* Run with:
\*   java -jar tla2tools.jar -config DrainProtocol.cfg -workers auto -metadir /tmp/tlc MC.tla

CONSTANTS
    AppIDs <- MC_AppIDs
    ServiceNames <- MC_ServiceNames
    ConsensusType <- MC_ConsensusType
    PrtTournamentActive <- MC_PrtTournamentActive

SPECIFICATION MC_Spec

INVARIANTS
    Safety_PurgeRequiresAcks
    Safety_AdvAckImpliesNoMachine
    Safety_ClmAckImpliesNoInFlight
    Safety_PRTAckImpliesNoInFlight
    Safety_NoAcksBeforeDrain
    Safety_ForceImpliesHardDeleted
    Safety_DeletedImpliesDisabled

PROPERTIES
    Liveness_DrainCompletes
    Liveness_ForcePurgeCleanup
