\* TLC configuration for drain trace validation.
\*
\* Uses the same constants as the Go simulation in internal/drain/trace:
\*   AppIDs = {1, 2, 3}
\*   ServiceNames = {"advancer", "claimer", "prt"}
\*   ConsensusType = [1 |-> AUTHORITY, 2 |-> QUORUM, 3 |-> PRT]
\*   PrtTournamentActive = [1 |-> FALSE, 2 |-> FALSE, 3 |-> TRUE]
\*
\* Run with:
\*   java -jar tla2tools.jar -config TraceDrainProtocol.cfg \
\*        -deadlock -workers auto TraceDrainProtocol

CONSTANTS
    AppIDs <- Trace_AppIDs
    ServiceNames <- Trace_ServiceNames
    ConsensusType <- Trace_ConsensusType
    PrtTournamentActive <- Trace_PrtTournamentActive

SPECIFICATION TraceSpec

INVARIANTS
    Safety_PurgeRequiresAcks
    Safety_AdvAckImpliesNoMachine
    Safety_ClmAckImpliesNoInFlight
    Safety_PRTAckImpliesNoInFlight
    Safety_NoAcksBeforeDrain
    Safety_ForceImpliesHardDeleted
    Safety_DeletedImpliesDisabled
