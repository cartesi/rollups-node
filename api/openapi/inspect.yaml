openapi: 3.0.0

info:
  title: Inspect-state HTTP API for Cartesi Rollups
  version: 0.7.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

  description: |
    API that allows the DApp frontend to make inspect-state requests to the DApp backend.

paths:
  inspect/{dapp}:
    post:
      operationId: inspect_post
      summary: Inspect DApp state via POST
      description: |
        This POST method sends an inspect-state request to the DApp backend, using the body contents as a binary payload for the inspect method.

        The response includes the inspection completion status, reports generated by the DApp backend, and the number of previously processed inputs. The optional `error` field contains a sanitized description when the status is `Exception` or `Failed`. For `Exception`, `exception_data` contains the raw CMIO payload supplied by the guest.

        The inspect operation is executed on a temporary fork of the machine created upon request arrival, which is discarded afterward. Note that this method is synchronous and not recommended for resource-intensive operations.

      parameters:
        - in: path
          name: dapp
          description: dapp name or address
          required: true
          schema:
            type: string

      requestBody:
        description: Binary payload
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary

      responses:
        "200":
          description: Inspect state response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectResult"

        "404":
          description: Application not found.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"

        "503":
          description: |
            The inspect request cannot be served right now.

            This can happen when the application is registered but its
            Cartesi Machine instance has not been initialized yet, when the
            application has been foreclosed and its machine is no longer
            available for live inspect requests, when application execution
            has terminated, or when the application's inspect capacity is
            exhausted.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                machineNotReady:
                  value: Machine not ready
                foreclosed:
                  value: Application was foreclosed; machine unavailable
                terminal:
                  value: Application is terminal; inspect unavailable
                atCapacity:
                  value: Application inspect at capacity

        default:
          description: Error response.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    InspectResult:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/CompletionStatus"
        error:
          type: string
          description: Sanitized error description, present only when status is Exception or Failed
          example: "The node could not complete the inspection"
        exception_data:
          allOf:
            - $ref: "#/components/schemas/Payload"
          description: Raw guest-provided CMIO exception payload, present only when status is Exception
        reports:
          type: array
          description: Reports emitted before completion; for Failed, this may be only a partial prefix
          items:
            $ref: "#/components/schemas/Report"
        processed_input_count:
          type: integer
          description: Number of processed inputs since genesis
          example: 0
      required:
        - status
        - reports
        - processed_input_count

    CompletionStatus:
      type: string
      description: |
        How inspection completed. MachineHalted means the temporary inspect
        execution halted; the canonical application machine is unchanged.
        Failed means the node could not complete inspection because of an
        operational limit, cancellation, timeout, protocol error, or internal
        failure. Reports returned with Failed may be partial.
      enum: [Accepted, Rejected, Exception, MachineHalted, Failed]
      example: "Accepted"

    Payload:
      type: string
      description: |
        Payload in the Ethereum hex binary format.
        The first two characters are '0x' followed by pairs of hexadecimal numbers that correspond to one byte.
        For instance, '0xdeadbeef' corresponds to a payload with length 4 and bytes 222, 173, 190, 175.
        An empty payload is represented by the string '0x'.
      example: "0xdeadbeef"
      pattern: "^0x([0-9a-fA-F]{2})*$"
      format: hex

    Report:
      type: object
      properties:
        payload:
          $ref: "#/components/schemas/Payload"
      required:
        - payload

    Error:
      type: string
      description: Detailed error message.
      example: "The request could not be understood by the server due to malformed syntax"
