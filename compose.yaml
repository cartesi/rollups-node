x-env: &env
  CARTESI_LOG_LEVEL: info
  CARTESI_BLOCKCHAIN_HTTP_ENDPOINT_FILE: /run/secrets/blockchain_http_endpoint
  CARTESI_BLOCKCHAIN_ID: 31337
  CARTESI_BLOCKCHAIN_DEFAULT_BLOCK: ${CARTESI_BLOCKCHAIN_DEFAULT_BLOCK:-latest}
  CARTESI_EVM_READER_POLLING_INTERVAL: 1
  CARTESI_CONTRACTS_INPUT_BOX_ADDRESS: "0xEbE915623f5887426C23C89fbD1de5c497e0e08E"
  CARTESI_CONTRACTS_AUTHORITY_FACTORY_ADDRESS: "0xAd208ee3574eB121C5535D848ba106a6EB5700D2"
  CARTESI_CONTRACTS_QUORUM_FACTORY_ADDRESS: "0x97602f62e3F69C37538c3c4Ce168911dacF5b352"
  CARTESI_CONTRACTS_APPLICATION_FACTORY_ADDRESS: "0x04BEA8345Ac754a66068b4ACde66cbC0B114A873"
  CARTESI_CONTRACTS_SELF_HOSTED_APPLICATION_FACTORY_ADDRESS: "0x2f94A7f9e15f528BFb4e31AF8d2602d4B648D107"
  CARTESI_CONTRACTS_DAVE_APP_FACTORY_ADDRESS: "0xf3E815d248480D47980aFA45508aF617Ffb2d5d6"
  CARTESI_DEVNET_WITHDRAWAL_OUTPUT_BUILDER_ADDRESS: "0xF223DEd6072F29C7C0FfAAfdBbE6aE8813a2134d"
  CARTESI_DATABASE_CONNECTION_FILE: /run/secrets/database_connection
  CARTESI_AUTH_MNEMONIC_FILE: /run/secrets/auth_mnemonic
  CARTESI_AUTH_MNEMONIC_ACCOUNT_INDEX: 0
  CARTESI_PRT_AUTH_MNEMONIC_FILE: /run/secrets/auth_mnemonic
  CARTESI_PRT_AUTH_MNEMONIC_ACCOUNT_INDEX: 6

services:
  ethereum_provider:
    image: cartesi/rollups-node-devnet:devel
    networks:
      - devnet
    ports:
      - 8545:8545

  database:
    image: postgres:18-alpine
    shm_size: 128mb
    networks:
      - devnet
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rollupsdb || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rollupsdb

  migration:
    image: cartesi/rollups-node:devel
    command: cartesi-rollups-cli db init
    depends_on:
      database:
        condition: service_healthy
    networks:
      - devnet
    secrets:
      - database_connection
    restart: "no"
    environment:
      <<: *env

  node:
    image: cartesi/rollups-node:devel
    init: true
    command: cartesi-rollups-node
    depends_on:
      database:
        condition: service_healthy
      ethereum_provider:
        condition: service_healthy
    volumes:
      - node_data:/var/lib/cartesi-rollups-node/data
    networks:
      - devnet
    ports:
      - "10000:10000" # Supervisor
      - "10011:10011" # Jsonrpc API service
      - "10012:10012" # Inspect Service
    secrets:
      - auth_mnemonic
      - blockchain_http_endpoint
      - database_connection
    environment:
      <<: *env

volumes:
  node_data:

networks:
  devnet:

secrets:
  auth_mnemonic:
    file: test/secrets/auth_mnemonic.txt
  blockchain_http_endpoint:
    file: test/secrets/blockchain_http_endpoint.txt
  database_connection:
    file: test/secrets/database_connection.txt
