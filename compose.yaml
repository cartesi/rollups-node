x-env: &env
  CARTESI_LOG_LEVEL: info
  CARTESI_BLOCKCHAIN_HTTP_ENDPOINT_FILE: /run/secrets/blockchain_http_endpoint
  CARTESI_BLOCKCHAIN_ID: 31337
  CARTESI_EVM_READER_POLLING_INTERVAL: 1
  CARTESI_CONTRACTS_INPUT_BOX_ADDRESS: 0x346B3df038FE9f8380071eC6514D5a83aD143939
  CARTESI_CONTRACTS_AUTHORITY_FACTORY_ADDRESS: 0x3C1FE01c542a88A523FF6847eD1E26176c8C4ED0
  CARTESI_CONTRACTS_QUORUM_FACTORY_ADDRESS: 0x1f94009389F408B8D0ADfFcF8BBDCe5552BaCa5F
  CARTESI_CONTRACTS_APPLICATION_FACTORY_ADDRESS: 0xC549F89cF1ca43eDDECC64Ac2208F4b283B1c483
  CARTESI_CONTRACTS_SELF_HOSTED_APPLICATION_FACTORY_ADDRESS: 0x6145C5996a71a379E030aEb0440df79D60833418
  CARTESI_CONTRACTS_DAVE_APP_FACTORY_ADDRESS: 0x33FFf0b681c90664dD048a60400AE2D827a4c5bb
  CARTESI_DEVNET_WITHDRAWAL_OUTPUT_BUILDER_ADDRESS: 0x0745787835A019cd4dae8EDB541Fbc0647793d63
  CARTESI_DATABASE_CONNECTION_FILE: /run/secrets/database_connection
  CARTESI_AUTH_MNEMONIC_FILE: /run/secrets/auth_mnemonic

services:
  ethereum_provider:
    image: cartesi/rollups-node-devnet:devel
    networks:
      - devnet
    ports:
      - 8545:8545

  database:
    image: postgres:17-alpine
    shm_size: 128mb
    networks:
      - devnet
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rollupsdb || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rollupsdb

  migration:
    image: cartesi/rollups-node:devel
    command: cartesi-rollups-cli db init
    depends_on:
      database:
        condition: service_healthy
    networks:
      - devnet
    secrets:
      - database_connection
    restart: "no"
    environment:
      <<: *env

  node:
    image: cartesi/rollups-node:devel
    init: true
    command: cartesi-rollups-node
    depends_on:
      database:
        condition: service_healthy
      ethereum_provider:
        condition: service_healthy
    volumes:
      - node_data:/var/lib/cartesi-rollups-node/data
    networks:
      - devnet
    ports:
      - "10000:10000" # Supervisor
      - "10011:10011" # Jsonrpc API service
      - "10012:10012" # Inspect Service
    secrets:
      - auth_mnemonic
      - blockchain_http_endpoint
      - database_connection
    environment:
      <<: *env

volumes:
  node_data:

networks:
  devnet:

secrets:
  auth_mnemonic:
    file: test/secrets/auth_mnemonic.txt
  blockchain_http_endpoint:
    file: test/secrets/blockchain_http_endpoint.txt
  database_connection:
    file: test/secrets/database_connection.txt
