version: "2"
run:
  build-tags:
    - endtoendtests
linters:
  enable:
    - exhaustive
    - goconst
    - lll
    - misspell
    - mnd
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocritic
    - copyloopvar
    - gosec
    - nolintlint
    - prealloc
    - forbidigo
#    - depguard
  settings:
    lll:
      line-length: 140
      tab-width: 4
    mnd:
      ignored-functions:
        - ^make
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^config\.(SafeURL|URL)\.Raw$'
          pkg: '^github\.com/cartesi/rollups-node/internal/config$'
          msg: 'Use typed CLI connection helpers or reviewed service transports for raw URLs.'
        - pattern: '^rpc\.Dial.*$'
          pkg: '^github\.com/ethereum/go-ethereum/rpc$'
          msg: 'Use ethutil protected HTTP constructors.'
        - pattern: '^ethclient\.Dial.*$'
          pkg: '^github\.com/ethereum/go-ethereum/ethclient$'
          msg: 'Use ethutil protected HTTP constructors.'
        - pattern: '^factory\.NewRepositoryFromConnectionString$'
          pkg: '^github\.com/cartesi/rollups-node/internal/repository/factory$'
          msg: 'Use cli.OpenRepository for typed database connections.'
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests use synthetic URLs and in-process RPC connections to exercise the boundaries.
      - path: '_test\.go$'
        linters:
          - forbidigo
      - path: internal/jsonrpc/api/.*\.go
        text: avoid meaningless package names
        linters:
          - revive
      - path: internal/jsonrpc/.*\.go
        text: avoid package names that conflict with Go standard library package names
        linters:
          - revive
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
